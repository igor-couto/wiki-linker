<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" href="favicon.svg" type="image/x-icon">
        <title>WikiLinker</title>
        <link rel="stylesheet" href="styles.css">
    </head>

    <body>
        <header>
            <h1>WikiLinker</h1>
        </header>
        
        <main>
            <section class="text-area-section">
                <div class="text-area-container">
                    <label for="input-text">Input Text:</label>
                    <textarea id="input-text" placeholder="Your text goes here..."></textarea>
                </div>
                <div class="text-area-container">
                    <label for="output-text">Annotated Text:</label>
                    <textarea id="output-text" readonly></textarea>
                </div>
            </section>
            <button id="annotate-button">Annotate Text</button>
        </main>

        <div class="ad-container">
            <p>Advertisement</p>
            <ins class="adsbygoogle"
                style="display:inline-block;width:728px;height:90px"
                data-ad-client="ca-pub-XXXXXXXXXXXXXXXX"
                data-ad-slot="XXXXXXXXXX"></ins>
            <script>
                (adsbygoogle = window.adsbygoogle || []).push({});
            </script>
        </div>

        <footer>
            <p>&copy; 2024 WikiLinker, All rights reserved</p>
        </footer>

        <script src="script.js"></script>
    </body>

</html>
