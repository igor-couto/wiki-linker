user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;

    keepalive_timeout  65;

    proxy_cache_path /var/cache/nginx/cache levels=1:2 keys_zone=mmcache:10m max_size=50m inactive=60m use_temp_path=off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_proxied any;
    gzip_min_length 1024;

    server {
        listen 80;
        server_name wiki-linker.com www.wiki-linker.com;

        root /var/www/wiki-linker.com/html;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
            add_header Cache-Control "public, max-age=604800";
            expires 7d;
        }

        location /api/ {
            proxy_pass http://localhost:50030/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}